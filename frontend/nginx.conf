# Serves the built Angular bundle and proxies the API on the same origin.
#
# Same-origin matters: the session cookie is HttpOnly and SameSite-scoped, so
# putting the SPA and the API behind one hostname avoids third-party cookie
# restrictions entirely and keeps CORS out of the browser path.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind a TLS-terminating load balancer, so no redirect to HTTPS here.

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable, so they can be cached indefinitely.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or a deploy leaves clients on stale
  # bundles whose hashed assets no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location /api/ {
    # API_ORIGIN is substituted at container start by envsubst.
    proxy_pass ${API_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Uploads are capped at 10 MB by the API; reject larger bodies here first.
    client_max_body_size 12m;
    proxy_read_timeout 60s;
  }

  # Deep links are client-side routes, so unknown paths must return the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
