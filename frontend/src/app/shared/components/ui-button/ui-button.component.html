<button
  [class]="classes()"
  [attr.type]="type()"
  [disabled]="isInactive()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="ui-button__spinner" aria-hidden="true"></span>
  } @else if (icon()) {
    <app-ui-icon [name]="icon()!" size="sm" />
  }
  <span class="ui-button__label"><ng-content /></span>
</button>
