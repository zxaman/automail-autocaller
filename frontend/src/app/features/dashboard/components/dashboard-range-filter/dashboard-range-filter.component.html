<div class="range-filter">
  <div class="range-filter__presets" role="group" aria-label="Date range">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="range-filter__preset"
        [class.range-filter__preset--active]="selection().preset === option.value"
        [attr.aria-pressed]="selection().preset === option.value"
        [attr.title]="option.description"
        [disabled]="disabled()"
        (click)="selectPreset(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  @if (isCustom()) {
    <div class="range-filter__custom">
      <label class="range-filter__field">
        <span class="range-filter__label">From</span>
        <input
          type="date"
          class="range-filter__input"
          [value]="customFrom()"
          [max]="today"
          [disabled]="disabled()"
          (change)="updateFrom($any($event.target).value)"
        />
      </label>

      <label class="range-filter__field">
        <span class="range-filter__label">To</span>
        <input
          type="date"
          class="range-filter__input"
          [value]="customTo()"
          [max]="today"
          [disabled]="disabled()"
          (change)="updateTo($any($event.target).value)"
        />
      </label>

      <button
        type="button"
        class="range-filter__apply"
        [disabled]="disabled() || !canApplyCustom()"
        (click)="applyCustom()"
      >
        Apply
      </button>
    </div>
  }
</div>
