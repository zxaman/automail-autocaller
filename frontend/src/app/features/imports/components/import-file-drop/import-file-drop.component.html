<div class="file-drop">
  <label
    class="file-drop__zone"
    [class.file-drop__zone--dragging]="isDragging()"
    [class.file-drop__zone--disabled]="disabled()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input
      type="file"
      class="file-drop__input"
      [accept]="accept"
      [disabled]="disabled()"
      (change)="onFileInput($event)"
    />

    <span class="file-drop__title">
      {{ disabled() ? 'Reading your file…' : 'Drop a spreadsheet here' }}
    </span>
    <span class="file-drop__hint text-secondary">
      or click to browse — .xlsx, .xls, or .csv, up to 10 MB
    </span>
  </label>

  @if (validationError()) {
    <p class="file-drop__error" role="alert">{{ validationError() }}</p>
  }
</div>
